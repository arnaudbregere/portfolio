name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # Les deux paquets sont indépendants : chacun installe ses propres
      # dépendances. `e2e/` ne connaît pas Nuxt, la racine ne connaît pas
      # Playwright.
      - name: Dépendances de l'application
        run: npm ci

      - name: Dépendances des tests
        run: npm ci
        working-directory: e2e

      # Playwright exécute les specs via esbuild : sans cette étape, une erreur
      # de type ne se verrait qu'à l'exécution, et seulement si la ligne est
      # atteinte.
      - name: Typecheck des tests
        run: npm run typecheck
        working-directory: e2e

      - name: Navigateur
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # `playwright.config.ts` construit l'application et sert `.output` :
      # aucune étape de build séparée ici, et jamais `nuxt dev`.
      - name: Playwright
        run: npm test
        working-directory: e2e

      - name: Rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
