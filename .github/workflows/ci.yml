name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Un job par vérification. Elles sont indépendantes : les quatre premières
# démarrent ensemble, et un échec de lint n'empêche plus de voir le résultat
# des tests. Chacune réinstalle ses dépendances — le cache npm de
# `setup-node` en fait l'affaire, et c'est moins fragile que de transporter
# `node_modules` d'un job à l'autre.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      # Vitest transforme via esbuild et ne vérifie pas les types : cette
      # étape est la seule qui les voie.
      - run: npm run typecheck

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm run build

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les deux paquets sont indépendants : chacun installe les siennes.
      # `e2e/` ne connaît pas Nuxt, la racine ne connaît pas Playwright.
      - uses: ./.github/actions/deps
      - uses: ./.github/actions/deps
        with:
          working-directory: e2e

      # Playwright exécute les specs via esbuild : sans cette étape, une
      # erreur de type ne se verrait qu'à l'exécution, et seulement si la
      # ligne est atteinte.
      - name: Typecheck des tests
        run: npm run typecheck
        working-directory: e2e

      - name: Navigateur
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # `playwright.config.ts` construit l'application et sert `.output` :
      # aucune étape de build séparée ici, et jamais `nuxt dev`.
      - name: Playwright
        run: npm test
        working-directory: e2e

      - name: Rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
